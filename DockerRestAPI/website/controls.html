<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saved Control Times</title>
  <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/css/bootstrap.min.css">
  <script
     src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js">
  </script>
</head>
<body>
<div class="container">
  <h1 id="page-title">Saved Control Times</h1>
  <a href="/" class="btn btn-default">Back to calculator</a>
  <a href="http://localhost:5001/listAll/csv" class="btn btn-default" id="all-csv">Download CSV</a>
  <a href="http://localhost:5001/listOpenOnly/csv" class="btn btn-default" id="open-csv">Download CSV</a>
  <a href="http://localhost:5001/listCloseOnly/csv" class="btn btn-default" id="close-csv">Download CSV</a>
  <select name="top" id="max-controls">
    <option value="">No Limit</option>
    <option value="0">0</option>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
    <option value="7">7</option>
    <option value="8">8</option>
    <option value="9">9</option>
    <option value="10">10</option>
  </select>


    <div class="table-responsive">
      <table class="table table-striped" id="controls-table">
        <thead>
          <tr>
            <th>Brevet distance (km)</th>
            <th>Start</th>
            <th>km</th>
            <th>Miles</th>
            <th>Location</th>
            <th class="open-time">Open</th>
            <th class="close-time">Close</th>
          </tr>
        </thead>
        <tbody id="controls-tbody">
        </tbody>
      </table>
    </div>
</div>
<script type="text/javascript">
    var view = new URLSearchParams(window.location.search).get('view');
    var endpoint = 'listAll';
    if (view === 'open') {
      endpoint = 'listOpenOnly';
      $('#page-title').text('Saved Open Times');
      $('.close-time').hide();
      $('#all-csv').hide();
      $('#close-csv').hide();
    } else if (view === 'close') {
      endpoint = 'listCloseOnly';
      $('#page-title').text('Saved Close Times');
      $('.open-time').hide();
      $('#all-csv').hide();
      $('#open-csv').hide();
    } else {
      view = 'all';
      $('#open-csv').hide();
      $('#close-csv').hide();
      $('#max-controls').hide();
    }
    $('#max-controls').on('change', function() {
      const selectedValue = $(this).val();
      load_data(selectedValue);
    });
    function load_data(top) {
      $("#controls-tbody").empty();
      $.getJSON('http://localhost:5001/' + endpoint, {"top":top},
        // response handler
        function(data) {
          console.log(data);
          data.brevets.forEach(function(brevet) {
            brevet.controls.forEach(function(control) {
              $("#controls-tbody").append(
                "<tr><td>" + brevet.distance +
                "</td><td>" + brevet.begin_date + brevet.begin_time +
                "</td><td>" + control.km +
                "</td><td>" + control.mi +
                "</td><td>" + control.location +
                (view !== 'close' ? "<td class='open-time'>" + control.open + "</td>" : "") +
                (view !== 'open' ? "<td class='close-time'>" + control.close + "</td>" : "") +
                "</tr>");
            });
          });
        } // end of handler function
      ).fail(function(jqXHR, textStatus, error) {
          console.error("Failed to fetch from laptop-service:", textStatus, error);
          $("#controls-tbody").append(
            "<tr><td colspan='" + (view === 'all' ? 7 : 6) +
            "' style='color:red'>Failed to load control times: " +
            textStatus + " - check CORS / service is running</td></tr>");
      });// End of getJSON
    }
    load_data(null);

</script>
</body>
</html>
